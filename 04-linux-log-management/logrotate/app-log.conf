/home/ec2-user/log-demo/app.log {
    # Rotate the active log once per day when logrotate is invoked.
    daily
    # Keep seven rotated log files before removing the oldest one.
    rotate 7
    # Compress older rotated files to save space.
    compress
    # Do not report an error if the log file does not exist.
    missingok
    # Do not rotate an empty log file.
    notifempty
}
